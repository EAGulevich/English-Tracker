<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Tracker</title><style>body{margin:0;background:#f5f5fb;color:#303047;font:16px system-ui,sans-serif}main{max-width:1050px;margin:45px auto;padding:20px}h1{font-size:36px}.sub{color:#74748a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:26px 0}.card,section{background:white;border-radius:22px;padding:24px;box-shadow:0 5px 20px #39315b0b}.number{font-size:36px;font-weight:800;color:#7865b9}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}button{border:0;border-radius:15px;padding:12px 18px;background:#e9e5f5;color:#493b76;cursor:pointer}button.active{background:#7865b9;color:white}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:11px;border-bottom:1px solid #eee}th{color:#76669c}.status{display:inline-block;border-radius:20px;background:#ededf0;color:#777;padding:5px 10px}section{overflow-x:auto}a{color:#6b58ad}</style></head><body><main><h1>🌿 English Tracker</h1><p class="sub">Мой путь к свободному английскому · <span id="state">Загрузка Google Sheets…</span></p><div class="cards"><div class="card">🎯 Цель<div class="number" id="goal">B2</div></div><div class="card">📚 Тем изучено<div class="number" id="done">—</div></div><div class="card">🧠 Слов<div class="number" id="words">—</div></div><div class="card">✓ Проверок<div class="number" id="checks">—</div></div></div><nav class="tabs" id="tabs"></nav><section><h2 id="heading"></h2><div id="table"></div></section><p class="sub">Данные загружаются из <a href="https://docs.google.com/spreadsheets/d/1boVoswEv_AbZqVOtJ12cKV-bo4cyeTT-HdZxa9hn62s/edit" target="_blank" rel="noopener">Google Sheets</a>. Обнови страницу, чтобы получить свежие результаты.</p></main><script>const id='1boVoswEv_AbZqVOtJ12cKV-bo4cyeTT-HdZxa9hn62s',sheets={'Настройки':342445716,'Проверки':500000,'Грамматика':500001,'Словарь':500002,'Повторения':500003},data={};function parse(t){let m=t.match(/google\.visualization\.Query\.setResponse\((.*)\);?\s*$/s);if(!m)throw Error('Неверный ответ таблицы');let o=JSON.parse(m[1]);if(o.status==='error')throw Error(o.errors?.[0]?.detailed_message||'Нет доступа');return (o.table.rows||[]).map(r=>r.c.map(c=>c?.f??c?.v??''))}async function load(name,gid){let u='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?gid='+gid+'&tqx=out:json&headers=0&cache='+Date.now();let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return parse(await r.text())}function show(name){document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.textContent===name));document.getElementById('heading').textContent=name;let rows=data[name]||[];document.getElementById('table').innerHTML=rows.length?'<table><thead><tr>'+rows[0].map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'Пока нет данных'}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function start(){let names=Object.keys(sheets);names.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>show(n);document.getElementById('tabs').append(b)});let results=await Promise.allSettled(names.map(n=>load(n,sheets[n])));let failures=[];results.forEach((r,i)=>{if(r.status==='fulfilled')data[names[i]]=r.value;else failures.push(names[i])});document.getElementById('state').textContent=failures.length?'Не удалось загрузить: '+failures.join(', '):'Google Sheets · синхронизация завершена';document.getElementById('goal').textContent=(data['Настройки']||[]).find(r=>r[0]==='Цель')?.[1]||'B2';document.getElementById('done').textContent=(data['Грамматика']||[]).slice(1).filter(r=>/изучен|освоен|выучен/i.test(r[1])).length;document.getElementById('words').textContent=Math.max(0,(data['Словарь']||[]).length-1);document.getElementById('checks').textContent=Math.max(0,(data['Проверки']||[]).length-1);show('Грамматика')}start();</script></body></html>
